<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ajGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="ajBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="16" fill="url(#ajBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1.5" />

  <!-- Dynamic Speed Wing Emblem -->
  <path d="M10 22 L22 14 L30 22 L22 25 Z" fill="url(#ajGold)" opacity="0.9" />

  <!-- Bold AJ Monogram -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M22 48 L27 34 L33 34 L38 48 L33.5 48 L32.2 44 L27.8 44 L26.5 48 Z M28.8 40.5 L31.2 40.5 L30 36.8 Z" fill="#FFFFFF" />
    <!-- Letter J with Golden Accent -->
    <path d="M38 34 L43 34 L43 44.5 C43 47.5 40.8 48.5 37.5 48.5 C35.2 48.5 33.5 47.8 33 47 L34.8 44.2 C35.4 44.7 36.4 45.2 37.6 45.2 C39 45.2 39.8 44.5 39.8 43.2 L39.8 34 Z" fill="url(#ajGold)" />
  </g>

  <!-- Accent Travel Stars/Speed Dots -->
  <circle cx="48" cy="18" r="2.5" fill="#FBBF24" />
  <circle cx="53" cy="24" r="1.5" fill="#F59E0B" opacity="0.75" />
</svg>